<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva incidencia</title>
    <link rel="stylesheet" href="styles.css">
    <script src="crear.js" defer></script>
</head>
<body>
    <main>
        <a href="/">← Volver a incidencias</a>

        <h1>Nueva incidencia</h1>

        <form id="formulario">
            <label for="titulo">Título *</label>
            <input id="titulo" type="text" maxlength="100" required>

            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" maxlength="2000" rows="4"></textarea>

            <label for="prioridad">Prioridad *</label>
            <select id="prioridad" required>
                <option value="">Selecciona una prioridad</option>
                <option value="BAJA">Baja</option>
                <option value="MEDIA">Media</option>
                <option value="ALTA">Alta</option>
            </select>

            <label for="usuarioId">ID del usuario asignado</label>
            <input id="usuarioId" type="number" min="1" step="1"
                   aria-describedby="ayuda-usuario">

            <small id="ayuda-usuario">
                Opcional. Usuarios de ejemplo: 1 Ana, 2 Luis y 3 Marta.
            </small>

            <button class="boton" id="guardar" type="submit">
                Crear incidencia
            </button>

            <p id="mensaje" role="status"></p>
        </form>
    </main>
</body>
</html>
